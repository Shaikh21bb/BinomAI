services:
  - type: web
    name: binom-backend
    runtime: docker
    repo: https://github.com/Shaikh21bb/BinomAI
    branch: main
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        value: redis://localhost:6379/1
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://localhost:6379/0
      - key: CORS_ORIGINS
        value: https://binom-ai-vprod.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PRIMARY_LLM_MODEL
        sync: false
      - key: FALLBACK_LLM_MODEL
        sync: false
